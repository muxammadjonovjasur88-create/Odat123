org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# --- Windows file-lock mitigations for the (empty, Flutter-injected) CMake
# build: "generate_cxx_metadata_*_timing.txt ... used by another process". ---
# Serialize tasks so per-ABI CMake configures don't race each other.
org.gradle.parallel=false
org.gradle.workers.max=1
# Disable Gradle's native file-system watcher, which keeps file handles open on
# Windows and is a common cause of "used by another process" lock errors.
org.gradle.vfs.watch=false
# Keep the daemon warm so the NDK/CMake metadata is configured once and reused
# (incremental builds skip the flaky first-time configure).
org.gradle.daemon=true
