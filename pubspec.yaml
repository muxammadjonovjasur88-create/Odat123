name: flowa
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.19+4025

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  google_fonts: ^8.1.0
  firebase_core: 4.11.0
  firebase_auth: 6.5.4
  google_sign_in: ^6.2.2
  cloud_firestore: 6.6.0
  supabase_flutter: ^2.8.4
  image_picker: ^1.0.1
  flutter_image_compress: ^2.4.0
  firebase_messaging: 16.4.0
  cloud_functions: 6.3.3
  flutter_local_notifications: ^22.0.1
  table_calendar: ^3.2.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.0
  just_audio: ^0.10.4
  http: ^1.2.2
  easy_localization: ^3.0.7
  in_app_purchase: ^3.2.0
  speech_to_text: ^7.0.0
  share_plus: ^10.1.4
  camera: ^0.12.0+2
  google_mlkit_pose_detection: ^0.13.0
  video_player: ^2.9.0
  path_provider: ^2.1.6
  file_picker: ^11.0.2
  permission_handler: ^12.0.3
  wakelock_plus: ^1.2.10
  uuid: ^4.5.1
  intl: ^0.20.2
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_background_service: ^5.1.0
  flutter_compass: ^0.8.0
  url_launcher: ^6.3.1
  pdfx: ^2.9.2
  flutter_webrtc: ^0.12.12
  battery_plus: ^7.1.1

# path_provider_android 2.3.x switched to a native JNI implementation, which
# adds a flaky CMake/NDK build that locks files on Windows
# ("generate_cxx_metadata_*_timing.txt ... used by another process"). Pin to the
# pre-JNI 2.2.x line (pure Kotlin) to remove the native build entirely.
dependency_overrides:
  path_provider_android: ">=2.2.0 <2.3.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: ^4.1.1
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# Launcher icon — run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/flowa_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#F2EFE9"
  adaptive_icon_foreground: "assets/icon/flowa_icon.png"
  remove_alpha_ios: true # App Store rejects icons with an alpha channel

# Native splash — run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  image: "assets/icon/flowa_icon.png"
  image_dark: "assets/icon/flowa_icon.png"
  android_12:
    color: "#000000"
    color_dark: "#000000"
    image: "assets/icon/flowa_icon.png"
    image_dark: "assets/icon/flowa_icon.png"

flutter:
  uses-material-design: true
  assets:
    - design/
    - assets/translations/
    - assets/images/
    - assets/images/onboarding/
    - assets/sounds/
    - assets/icon/
    - assets/fonts/
    - assets/intro/
    - assets/intro/intro.mp4

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
